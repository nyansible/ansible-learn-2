- name: Configure Ubuntu server
  hosts: webservers
  become: true

  tasks:
    - name: Update all packages
      ansible.builtin.apt:
        name: "*"
        state: latest
        update_cache: true

- name: Set up WireGuard VPN
  hosts: vpn
  become: true
  pre_tasks:
    - name: Parse wireguard_addresses from JSON string
      ansible.builtin.set_fact:
        wireguard_addresses: "{{ wireguard_addresses | from_json }}"
      when: wireguard_addresses is defined and wireguard_addresses is string and wireguard_addresses is match('^\[.*\]$')
  roles:
    - role: githubixx.ansible_role_wireguard
      wireguard_flush_handlers: true

- name: Configure services over VPN
  hosts: webservers
  become: true
  #gather_facts: false
  vars:
    ansible_host: "10.8.0.2"

  tasks:
    - name: Wait for VPN connection
      ansible.builtin.wait_for_connection:
        timeout: 30

    # Add VPN-dependent tasks below
    - name: Verify VPN connectivity
      ansible.builtin.command: ping -c 1 10.8.0.1
      changed_when: false

    - name: Enable NAT masquerade for VPN traffic
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ ansible_default_ipv4.interface }}"
        jump: MASQUERADE

    - name: Persist iptables rules
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
#Lets see if I can write ansible

- name: Allow sysctl forwarding
  hosts: vpn,webservers
  become: true

  tasks:
    - name: sysctl cmd 
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        reload: true
